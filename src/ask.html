<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Typr</title>
    <link rel="stylesheet" href="/src/fonts/fonts.css" />
    <link rel="stylesheet" href="/src/ask.css" />
  </head>
  <body>
    <!-- The whole transparent window; only the card takes clicks (ask.rs) -->
    <div id="frame" data-state="dot" data-phase="thinking" data-mode="ask">
      <div id="card">
        <div class="strip"><span id="toast" class="toast" role="status"></span></div>
        <div id="scroll">
          <div id="content">
            <!-- Quick chat before the first question: how to ask -->
            <p id="empty" class="empty hidden"></p>
            <!-- The answers; in quick chat the questions too -->
            <div id="messages"></div>
            <p id="notice" class="notice hidden" role="status"></p>
          </div>
        </div>
      </div>

      <!-- The recording indicator's dot: it becomes the card's status light -->
      <div id="orb" aria-hidden="true">
        <i class="mic" data-icon="mic" data-size="18"></i>
        <span class="spin"></span>
      </div>

      <!-- No title tooltip: WebView2 can leave one on screen after the window closes -->
      <button type="button" id="close" aria-label="Close">
        <i data-icon="x" data-size="14"></i>
      </button>
    </div>
    <script type="module" src="/src/ask.ts"></script>
  </body>
</html>
