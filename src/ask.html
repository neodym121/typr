<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Typr</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/ask.css" />
  </head>
  <body>
    <!-- The whole transparent window; only the card takes clicks (ask.rs) -->
    <div id="frame" data-state="dot" data-phase="thinking">
      <div id="card">
        <div class="strip"></div>
        <div id="scroll">
          <div id="content">
            <div id="answers"></div>
            <p id="notice" class="notice hidden" role="status"></p>
          </div>
        </div>
      </div>

      <!-- The recording indicator's dot: it becomes the card's status light -->
      <div id="orb" aria-hidden="true">
        <svg class="mic" width="18" height="18" viewBox="0 0 24 24" fill="none">
          <rect x="9" y="2" width="6" height="12" rx="3" fill="currentColor" />
          <path d="M6 11a6 6 0 0012 0" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          <path d="M12 17v4" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        </svg>
        <span class="spin"></span>
      </div>

      <!-- No title tooltip: WebView2 can leave one on screen after the window closes -->
      <button type="button" id="close" aria-label="Close">
        <svg width="10" height="10" viewBox="0 0 10 10" fill="none" aria-hidden="true">
          <path d="M1.5 1.5l7 7M8.5 1.5l-7 7" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" />
        </svg>
      </button>
    </div>
    <script type="module" src="/src/ask.ts"></script>
  </body>
</html>
