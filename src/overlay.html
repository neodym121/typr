<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        background: transparent;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
      }
      /* The window starts at the top edge of the screen; the mic rests 10px below it */
      body {
        height: 100vh;
        padding-top: 10px;
      }
      /* At the bottom the window ends at the taskbar; the mic rests 10px above it */
      body.bottom {
        padding-top: 0;
      }
      #slot {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 50px;
      }
      /* Slides down from behind the top edge of the screen */
      #slot.enter {
        animation: slide-in 0.22s cubic-bezier(0.33, 1, 0.68, 1);
      }
      /* or up from behind the taskbar */
      body.bottom #slot.enter {
        animation-name: slide-up;
      }
      .mic {
        position: relative;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: rgba(31, 30, 29, 0.94);
        border: 1px solid rgba(248, 248, 246, 0.14);
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      }
      .mic svg {
        width: 18px;
        height: 18px;
        stroke: #9c9a92;
        transition: stroke 0.2s ease;
      }
      /* Recording — the accent, the only chromatic colour */
      .mic.recording {
        background: #d97757;
        border-color: rgba(248, 248, 246, 0.22);
        animation: pulse 1.4s ease-in-out infinite;
      }
      .mic.recording svg {
        stroke: #f8f8f6;
      }
      /* Transcribing — a thin light arc spinning around the mic */
      .mic.transcribing {
        border-color: rgba(248, 248, 246, 0.2);
      }
      .mic.transcribing svg {
        stroke: #f8f8f6;
      }
      .mic.transcribing::after {
        content: '';
        position: absolute;
        inset: -1px;
        border-radius: 50%;
        border: 2px solid transparent;
        border-top-color: #f8f8f6;
        animation: spin 0.9s linear infinite;
      }
      /* Error — a brief accent ring */
      .mic.error {
        border-color: #d97757;
        box-shadow: 0 0 0 3px rgba(217, 119, 87, 0.35);
      }
      .mic.error svg {
        stroke: #d97757;
      }
      @keyframes pulse {
        0%, 100% { box-shadow: 0 0 0 0 rgba(217, 119, 87, 0.5); }
        50% { box-shadow: 0 0 0 4px rgba(217, 119, 87, 0); }
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      @keyframes slide-in {
        from { transform: translateY(-60px); }
        to { transform: none; }
      }
      @keyframes slide-up {
        from { transform: translateY(60px); }
        to { transform: none; }
      }
    </style>
  </head>
  <body>
    <div id="slot">
      <div class="mic" id="mic">
        <!-- Lucide "mic" (src/icons/mic.svg): this page has no scripts to load it -->
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 19v3" />
          <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
          <rect x="9" y="2" width="6" height="13" rx="3" />
        </svg>
      </div>
    </div>
  </body>
</html>
