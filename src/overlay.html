<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        background: transparent;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
      }
      /* The window starts at the top edge of the screen; the mic rests 10px below it */
      body {
        height: 100vh;
        padding-top: 10px;
      }
      /* At the bottom the window ends at the taskbar; the mic rests 10px above it */
      body.bottom {
        padding-top: 0;
      }
      #slot {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 50px;
      }
      /* Slides down from behind the top edge of the screen */
      #slot.enter {
        animation: slide-in 0.22s cubic-bezier(0.33, 1, 0.68, 1);
      }
      /* or up from behind the taskbar */
      body.bottom #slot.enter {
        animation-name: slide-up;
      }
      .mic {
        position: relative;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: rgba(31, 30, 29, 0.94);
        border: 1px solid rgba(248, 248, 246, 0.14);
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      }
      .mic svg {
        width: 18px;
        height: 18px;
        fill: #9c9a92;
        transition: fill 0.2s ease;
      }
      /* Recording — the accent, the only chromatic colour */
      .mic.recording {
        background: #d97757;
        border-color: rgba(248, 248, 246, 0.22);
        animation: pulse 1.4s ease-in-out infinite;
      }
      .mic.recording svg {
        fill: #f8f8f6;
      }
      /* Transcribing — a thin light arc spinning around the mic */
      .mic.transcribing {
        border-color: rgba(248, 248, 246, 0.2);
      }
      .mic.transcribing svg {
        fill: #f8f8f6;
      }
      .mic.transcribing::after {
        content: '';
        position: absolute;
        inset: -1px;
        border-radius: 50%;
        border: 2px solid transparent;
        border-top-color: #f8f8f6;
        animation: spin 0.9s linear infinite;
      }
      /* Error — a brief accent ring */
      .mic.error {
        border-color: #d97757;
        box-shadow: 0 0 0 3px rgba(217, 119, 87, 0.35);
      }
      .mic.error svg {
        fill: #d97757;
      }
      @keyframes pulse {
        0%, 100% { box-shadow: 0 0 0 0 rgba(217, 119, 87, 0.5); }
        50% { box-shadow: 0 0 0 4px rgba(217, 119, 87, 0); }
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      @keyframes slide-in {
        from { transform: translateY(-60px); }
        to { transform: none; }
      }
      @keyframes slide-up {
        from { transform: translateY(60px); }
        to { transform: none; }
      }
    </style>
  </head>
  <body>
    <div id="slot">
      <div class="mic" id="mic">
        <svg viewBox="0 0 24 24">
          <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5z"/>
          <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
        </svg>
      </div>
    </div>
  </body>
</html>
