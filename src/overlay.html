<!doctype html>
<!-- The recording indicator where Typr has no native one (on Windows
     overlay.rs draws it itself). overlay.rs sets the disc's data-state and
     the page's data-edge, and replays the slide with the "sliding" class. -->
<html lang="en" data-edge="top">
  <head>
    <meta charset="UTF-8" />
    <style>
      :root {
        --disc: rgba(31, 30, 29, 0.94);
        --rim: rgba(248, 248, 246, 0.14);
        --icon: #9c9a92;
        --light: #f8f8f6;
        --clay: #d97757;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html {
        background: transparent;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
      }
      /* At the top the window starts at the screen edge and the disc rests
         10 px below it; at the bottom the window ends at the taskbar and the
         disc rests 10 px above it */
      body { height: 100vh; padding-top: 10px; }
      html[data-edge="bottom"] body { padding-top: 0; }

      #rail { height: 50px; display: grid; place-items: center; }
      /* In from behind the edge it waits at */
      #rail.sliding { animation: from-top 0.22s cubic-bezier(0.33, 1, 0.68, 1); }
      html[data-edge="bottom"] #rail.sliding { animation-name: from-bottom; }

      #disc {
        position: relative;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: var(--disc);
        border: 1px solid var(--rim);
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
        transition: background 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      }
      #disc svg { width: 18px; height: 18px; stroke: var(--icon); transition: stroke 0.2s ease; }

      /* Listening: the accent, the only chromatic colour, beating gently */
      #disc[data-state="recording"] {
        background: var(--clay);
        border-color: rgba(248, 248, 246, 0.22);
        animation: beat 1.4s ease-in-out infinite;
      }
      /* Transcribing: a thin light arc going round */
      #disc[data-state="transcribing"] { border-color: rgba(248, 248, 246, 0.2); }
      #disc[data-state="transcribing"]::after {
        content: "";
        position: absolute;
        inset: -1px;
        border-radius: 50%;
        border: 2px solid transparent;
        border-top-color: var(--light);
        animation: turn 0.9s linear infinite;
      }
      #disc[data-state="recording"] svg,
      #disc[data-state="transcribing"] svg { stroke: var(--light); }
      /* A failed dictation: a short accent ring */
      #disc[data-state="error"] { border-color: var(--clay); box-shadow: 0 0 0 3px rgba(217, 119, 87, 0.35); }
      #disc[data-state="error"] svg { stroke: var(--clay); }

      @keyframes beat {
        from, to { box-shadow: 0 0 0 0 rgba(217, 119, 87, 0.5); }
        50% { box-shadow: 0 0 0 4px rgba(217, 119, 87, 0); }
      }
      @keyframes turn { to { transform: rotate(1turn); } }
      @keyframes from-top { from { transform: translateY(-60px); } }
      @keyframes from-bottom { from { transform: translateY(60px); } }
    </style>
  </head>
  <body>
    <div id="rail">
      <div id="disc" data-state="idle">
        <!-- Lucide "mic" (src/icons/mic.svg): this page has no scripts to load it -->
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 19v3" />
          <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
          <rect x="9" y="2" width="6" height="13" rx="3" />
        </svg>
      </div>
    </div>
  </body>
</html>
